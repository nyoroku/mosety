<style>
    /* Hero enhancements */
    .hero-overlay {

    /* Image loading spinner */
    .image-loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 3px solid rgba(16, 184, 199, 0.1);

        z-index: 10;
    }

    @keyframes spin {
        to {
            transform: translate(-50%, -50%) rotate(360deg);
        }
    }

    .lazy-load.loaded~.image-loading-spinner {
        display: none;
    }

    /* Image optimization */
    .lazy-load {
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .lazy-load.loaded {

    }

        overflow: hidden;
        background: #f0f0f0;
    }

    .img-16x9 img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .img-1x1 {
        position: relative;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        background: #f0f0f0;
    }

    .img-1x1 img {
